<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2 id="output"></h2>
    <script>
        let name = "chethan"
        const college = "gec College"
        var age = "22"

        age = Number(age)
        
        let student = {
            name : name,
            age : age,
            college : college
        }
        document.getElementById("output").innerHTML=
        "name : " + student.name+"<br>"+
        "age : " + student.age+"<br>"+
        "College : " + student.college;

        console.log(student)

        // let val = 100
        // alert(typeof val)
    </script>
</body>
</html>
