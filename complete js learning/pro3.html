<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Calculator</h2>

    <p id="result"></p>
    <script>
        // ternary operator
        // let age = 19
        // let result = (age>18)? "adult" : "minor";
        // console.log(result);
        
        let a = 10;
        let b = 5;

        // Arithmetic
        let sum = a + b;
        let multiply = a * b;

        // Comparison + Ternary
        let age = 17;
        let status = (age >= 18) ? "Eligible to vote" : "Not eligible";

        // Output
        document.getElementById("result").innerHTML =
        "Sum: " + sum + "<br>" +
        "Multiply: " + multiply + "<br>" +
        "Status: " + status;

        console.log(typeof age);

    </script>
</body>
</html>
