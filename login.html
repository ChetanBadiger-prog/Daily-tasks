<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Page</title>

<style>

body{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg,#73ccea,#2fb6f5);
}


fieldset{
    background:white;
    padding:60px;
    padding-;
    border-radius:12px;
    border:none;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
    width:350px;
    text-align:center;
}

h1{
    margin-bottom:25px;
}

input[type="email"],
input[type="password"]{
    width:100%;
    padding:12px;
    border-radius:6px;
    border:1px solid #ccc;
    outline:none;
    font-size:14px;
    margin-top:10px;
}

input:focus{
    border-color:#4c4ce8;
    box-shadow:0 0 5px rgba(76,76,232,0.5);
}


.login-btn{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#4c4ce8;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:15px;
    transition:0.3s;
}

.login-btn:hover{
    background:#2f2fcf;
    transform:scale(1.03);
}


.bottom-text{
    margin-top:15px;
}

a{
    color:#4c4ce8;
    text-decoration:none;
}

a:hover{
    text-decoration:underline;
}

</style>
</head>

<body>

<form>
<fieldset>

<h1>Login</h1>

<input type="email" placeholder="Email" required>

<input type="password" placeholder="Password" required>

<button class="login-btn">Login</button>

<div class="bottom-text">
Don’t have an account? <a href="sign_up_form.html">Sign Up</a>
</div>

</fieldset>
</form>

</body>
</html>
