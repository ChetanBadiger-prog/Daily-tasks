<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signup Form</title>

<style>

/* Page background */

body{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg,#73ccea,#2fb6f5);
}

/* Form Card */

fieldset{
    background:white;
    padding:50px;
    padding-left: 30px;
    border-radius:12px;
    border:none;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
    width:350px;
}

/* Heading */

h1{
    margin-bottom:25px;
}

/* Text Inputs */

input[type="text"],
input[type="email"],
input[type="password"]{
    width:100%;
    padding:12px;
    border-radius:6px;
    border:1px solid #ccc;
    outline:none;
    font-size:14px;
    margin-top:6px;
}

/* Input Focus Effect */

input:focus{
    border-color:#4c4ce8;
    box-shadow:0 0 5px rgba(76,76,232,0.5);
}

/* Checkbox Section */

.terms{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:15px;
    font-size:14px;
}

/* Signup Button */

.signup{
    width:100%;
    padding:12px;
    background:#4c4ce8;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:15px;
    margin-top:15px;
    transition:0.3s;
}

.signup:hover{
    background:#2f2fcf;
    transform:scale(1.03);
}

/* Login Link */

a{
    color:#4c4ce8;
    text-decoration:none;
}

a:hover{
    text-decoration:underline;
}

.bottom-text{
    margin-top:15px;
}

</style>
</head>

<body>

<form>
<fieldset>

<h1>Signup Form</h1>

<input type="text" placeholder="Username" required>
<br><br>

<input type="text" placeholder="Firstname" required>
<br><br>

<input type="text" placeholder="Lastname" required>
<br><br>

<input type="text" placeholder="Phone number" required>
<br><br>

<input type="email" placeholder="Email" required>
<br><br>

<input type="password" placeholder="Password" required>

<div class="terms">
<input type="checkbox" id="terms">
<label for="terms">I agree to Terms & Conditions</label>
</div>
<button class="signup">Sign Up</button>

<div class="bottom-text">
Already have an account? <a href="login.html">Login</a>
</div>

</fieldset>
</form>

</body>
</html>
