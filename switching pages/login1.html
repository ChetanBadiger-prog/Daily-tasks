<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center><h1>SignUP page</h1></center>
    <center>
    <input type="text" placeholder="Enter your name" id="a"><br>
    <input type="text" placeholder="Enter your Email" id="b"><br>
    <input type="text" placeholder="Enter your Password" id="c"><br>

    <button onclick="signup()">SignUP</button>
    </center>

    <script>
        function signup(){
        let username = document.getElementById("a").value
        let email = document.getElementById("b").value
        let password = document.getElementById("c").value

        localStorage.setItem("username",username)
        localStorage.setItem("email",email)
        localStorage.setItem("password",password)

        alert("data saved...")

        window.location.href = "signup.html"
        }
    </script>
</body>
</html>
